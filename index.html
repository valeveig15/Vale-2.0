<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de chat de Vale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;font-family:Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}
.phone{width:min(420px,100vw);height:min(780px,100vh);background:#111b21;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.7)}
.header{background:#202c33;padding:14px 18px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:#41515b;display:flex;align-items:center;justify-content:center;font-size:20px}
.header-info{flex:1}.header-name{font-weight:700;color:#e9edef}.header-status{font-size:.75rem;color:#8696a0}.header-status.typing{color:#00a884}
.sim-label{font-size:.65rem;color:#8696a0;margin-top:2px}
.messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.bubble-wrap{display:flex}.bubble-wrap.user{justify-content:flex-end}.bubble-wrap.vale{justify-content:flex-start}
.bubble{max-width:78%;padding:8px 12px;border-radius:12px;font-size:.92rem;line-height:1.45;word-break:break-word}
.user .bubble{background:#005c4b;color:#e9edef;border-bottom-right-radius:4px}.vale .bubble{background:#202c33;color:#e9edef;border-bottom-left-radius:4px}
.time{font-size:.65rem;color:#8696a0;text-align:right;margin-top:3px}
.typing-bubble{background:#202c33;border-radius:12px;padding:12px 16px;display:none}.typing-bubble.show{display:flex;gap:5px}
.dot{width:7px;height:7px;background:#8696a0;border-radius:50%;animation:bounce 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.input-area{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:10px}
#msg-input{flex:1;background:#2a3942;border:0;border-radius:24px;padding:10px 16px;color:#e9edef;font-size:.92rem;outline:none;resize:none;max-height:100px}
#send-btn{width:44px;height:44px;background:#00a884;border:0;border-radius:50%;cursor:pointer;color:white;font-size:20px}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar">💜</div>
    <div class="header-info">
      <div class="header-name">Vale 💜(~‾▿‾)~</div>
      <div class="header-status" id="status">en línea</div>
      <div class="sim-label">simulación conversacional · no es la persona real</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="bubble-wrap vale"><div class="bubble"><span>Holaaaa!!!</span><div class="time">ahora</div></div></div>
    <div class="bubble-wrap typing-bubble" id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <div class="input-area">
    <textarea id="msg-input" placeholder="Escribí un mensaje..." rows="1"></textarea>
    <button id="send-btn" type="button" aria-label="Enviar">➤</button>
  </div>
</div>

<script src="js/banks/saludos.js"></script>
<script src="js/banks/personalidad.js"></script>
<script src="js/banks/vida.js"></script>
<script src="js/banks/opiniones.js"></script>
<script src="js/banks/juegos.js"></script>
<script src="js/banks/filosofia.js"></script>
<script src="js/banks/conversacion.js"></script>
<script src="js/banks/mega1.js"></script>
<script src="js/banks/mega2.js"></script>
<script src="js/banks/mega3.js"></script>

<script src="js/data/profile.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/boundaries.js"></script>
<script src="js/core/context.js"></script>
<script src="js/core/style.js"></script>
<script src="js/core/registry.js"></script>
<script src="js/data/intents.js"></script>
<script src="js/core/matcher.js"></script>
<script src="js/core/fallback.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
